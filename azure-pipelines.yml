trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: '22.x'

  - script: |
      corepack enable
      corepack prepare pnpm@11.20.0 --activate
    displayName: 'Install pnpm'

  - script: pnpm install --frozen-lockfile
    displayName: 'Install dependencies'

  - script: |
      pnpm --version
      node --version
      pnpm --filter function why sequelize
      ls -la services/function/azure-db/node_modules/sequelize
    displayName: 'Verify Function dependencies'

  - script: pnpm -r run build
    displayName: 'Build all workspaces'