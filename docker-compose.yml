services:
  postgres:
    image: postgres:17
    container_name: dam-postgres

    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - azure-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    image: azure-api

    build:
      context: .
      dockerfile: services/api/Dockerfile

    container_name: azure-api

    restart: unless-stopped

    env_file:
      - .env.development

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5001:5001"

    networks:
      - azure-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/v1/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: azure-web

    build:
      context: .
      dockerfile: apps/web/Dockerfile

    container_name: azure-web

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "5173:80"

    networks:
      - azure-network

volumes:
  postgres-data:

networks:
  azure-network:
    driver: bridge